# Single-node Redpanda for production on Ubuntu
# Resource target: 6GB RAM, 4 cores. Set REDPANDA_ADVERTISE_HOST to this server's IP or hostname for remote clients.
name: redpanda-prod

networks:
  redpanda_network:
    driver: bridge

volumes:
  redpanda-0: null

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.9
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://${REDPANDA_ADVERTISE_HOST:-localhost}:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://${REDPANDA_ADVERTISE_HOST:-localhost}:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --smp 3
      - --default-log-level=info
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - "18081:18081" # Schema Registry (Avro/Protobuf schema lookup)
      - "18082:18082" # PandaProxy (Kafka over HTTP REST; use if client is HTTP-only)
      - "19092:19092" # Kafka API (native) → producer / consumer bootstrap server
      - "19644:9644" # Admin API (cluster mgmt, metrics; e.g. Console, monitoring)
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  console:
    image: docker.redpanda.com/redpandadata/console:v3.5.3
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    networks:
      - redpanda_network
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    depends_on:
      redpanda-0:
        condition: service_healthy
